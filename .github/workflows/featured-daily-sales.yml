name: Featured Daily Sales

on:
  schedule:
    # 09:00 Asia/Shanghai = 01:00 UTC. GitHub may queue cron runs for a few minutes.
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: production-site
  cancel-in-progress: false

env:
  DATA_REPO: ${{ vars.DATA_REPO }}
  WFT_API_URL: ${{ vars.WFT_API_URL }}
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  BARK_GROUP: ${{ vars.BARK_GROUP }}
  BARK_TTL: ${{ vars.BARK_TTL }}

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate runtime configuration
        run: |
          test -n "$DATA_REPO" || { echo "::error::Set the DATA_REPO Actions variable."; exit 1; }
          printf '%s' "$DATA_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || {
            echo "::error::DATA_REPO must look like owner/repository."
            exit 1
          }
          test -n "$WFT_API_URL" || { echo "::error::Set the WFT_API_URL Actions variable."; exit 1; }
          case "$WFT_API_URL" in
            https://*) ;;
            *) echo "::error::WFT_API_URL must use HTTPS."; exit 1 ;;
          esac
          printf '%s' "$WFT_API_URL" | grep -Eq '^[^[:space:]]+$' || {
            echo "::error::WFT_API_URL must not contain whitespace."
            exit 1
          }
          test -n "$PAGES_BASE_URL" || { echo "::error::Set the PAGES_BASE_URL Actions variable."; exit 1; }
          case "$PAGES_BASE_URL" in
            https://*) ;;
            *) echo "::error::PAGES_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          test -n "$BARK_GROUP" || { echo "::error::Set the BARK_GROUP Actions variable."; exit 1; }
          printf '%s' "$BARK_GROUP" | grep -Eq '^[A-Za-z0-9_.-]+$' || {
            echo "::error::BARK_GROUP may only contain letters, numbers, dots, underscores, and hyphens."
            exit 1
          }
          test -n "$BARK_TTL" || { echo "::error::Set the BARK_TTL Actions variable."; exit 1; }
          case "$BARK_TTL" in
            ''|*[!0-9]*) echo "::error::BARK_TTL must be an integer."; exit 1 ;;
          esac
          if [ "$BARK_TTL" -lt 60 ] || [ "$BARK_TTL" -gt 86400 ]; then
            echo "::error::BARK_TTL must be between 60 and 86400 seconds."
            exit 1
          fi
      - name: Resolve artifact target
        id: target
        run: |
          value=$(grep -v '^[[:space:]]*#' config/artifact-target.txt | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          case "$value" in
            local|external)
              echo "artifact target: $value"
              echo "target=$value" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::config/artifact-target.txt must contain exactly 'local' or 'external' (found '${value:-<missing>}')."
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          pytest -q

      - name: Check out dashboard repository snapshot
        if: ${{ steps.target.outputs.target == 'external' }}
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO_TOKEN" || { echo "::error::Set the DATA_REPO_TOKEN repository secret."; exit 1; }
          rm -rf site
          git clone --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" site
          mv site/.git .artifact-git

      - name: Sync featured projects and yesterday sales
        env:
          WFT_TOKEN: ${{ secrets.WFT_TOKEN }}
        run: |
          test -n "$WFT_TOKEN" || { echo "::error::Set the WFT_TOKEN repository secret."; exit 1; }
          python -m sale_dashboard \
            --site-output site \
            --api-url "$WFT_API_URL" \
            --page-size 50 \
            --room-page-size 500 \
            --fetch-one-price \
            --enrichment-batch-size 0 \
            --featured-projects config/featured-projects.txt

      - name: Validate featured sales report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('site/data/featured-daily-sales/latest.json').read_text(encoding='utf-8'))
          if report.get('status') == 'error':
              raise SystemExit(f"Featured daily sales source failed: {report.get('message')}")
          for project in report.get('projects', []):
              if not project.get('countMatchesSource', True):
                  raise SystemExit(f"Building totals do not match source total for {project.get('name')}")
          PY

      - name: Ensure token is absent from generated artifacts
        env:
          WFT_TOKEN: ${{ secrets.WFT_TOKEN }}
        run: |
          python - <<'PY'
          import gzip
          import os
          from pathlib import Path

          token = os.environ["WFT_TOKEN"].encode("utf-8")
          for path in Path("site").rglob("*"):
              if not path.is_file():
                  continue
              content = path.read_bytes()
              if content.startswith(b"\x1f\x8b"):
                  content = gzip.decompress(content)
              if token in content:
                  raise SystemExit(f"Generated artifacts contain the upstream token: {path}")
          PY

      - name: Commit featured daily sales snapshot (local)
        if: ${{ steps.target.outputs.target == 'local' }}
        run: |
          git config user.name "wuhan-housing-market-task[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "No featured daily sales changes."
          else
            git commit -m "chore: update featured daily sales"
            git push
          fi

      - name: Commit featured daily sales snapshot (external)
        if: ${{ steps.target.outputs.target == 'external' }}
        run: |
          export GIT_DIR="$PWD/.artifact-git"
          export GIT_WORK_TREE="$PWD/site"
          git config user.name "wuhan-housing-market-task[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github'
          if git diff --cached --quiet; then
            echo "No featured daily sales changes."
          else
            git commit -m "chore: update featured daily sales"
            git push
          fi

      - name: Send Bark notification
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          test -n "$BARK_URL" || { echo "::error::Set the BARK_URL repository secret."; exit 1; }
          python - <<'PY'
          import json
          import os
          import ssl
          from pathlib import Path
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          report = json.loads(Path('site/data/featured-daily-sales/latest.json').read_text(encoding='utf-8'))
          base_url = os.environ['BARK_URL'].rstrip('/')
          pages_base_url = os.environ['PAGES_BASE_URL'].rstrip('/')
          bark_group = os.environ['BARK_GROUP'].strip()
          bark_ttl = int(os.environ['BARK_TTL'])
          if not base_url.startswith('https://'):
              raise SystemExit('BARK_URL must be an HTTPS endpoint')
          if not pages_base_url.startswith('https://'):
              raise SystemExit('PAGES_BASE_URL must use HTTPS')

          date = report.get('date') or '昨日'
          total_sold = int(report.get('totalSold') or 0)
          project_parts = [
              f"{project.get('name') or project.get('projectId') or '未知楼盘'} {int(project.get('soldCount') or 0)} 套"
              for project in report.get('projects', [])
          ]
          title = f'重点楼盘 {date} 成交 {total_sold} 套'
          body = '；'.join(project_parts) if project_parts else '暂无重点楼盘成交记录'
          report_url = f'{pages_base_url}/featured-daily-sales/'
          notification_url = (
              f"{base_url}/{quote(title, safe='')}/{quote(body, safe='')}?"
              + urlencode({'group': bark_group, 'ttl': str(bark_ttl), 'url': report_url})
          )
          request = Request(notification_url, headers={'User-Agent': 'wuhan-housing-market-task-action'})
          with urlopen(request, timeout=15, context=ssl.create_default_context()) as response:
              result = json.loads(response.read().decode('utf-8'))
          if result.get('code') != 200:
              raise SystemExit(f'Bark rejected the daily summary notification: {result}')
          print(f'notified featured daily summary: {total_sold} sold across {len(project_parts)} projects')
          PY
